<script id="app">
(function () {
  const KERANGKA = '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>';
  const KEPALA = '<title>Naskah Takut Harga Nambah</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Figtree:wght@400;600;700&display=swap">\n';

  const asli = JSON.parse(document.getElementById('data').textContent);
  let data = JSON.parse(JSON.stringify(asli));
  let mode = 'baca';
  let bisaSimpan = true;
  let pesan = '';

  const root = document.getElementById('root');
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const tokohById = (id) => data.tokoh.find((t) => t.id === id) || data.tokoh[0];
  const sorotHarga = (s) => esc(s).replace(/Rp[\d.]+/g, (m) => `<span class="angka">${m}</span>`);

  function ucapBaca(a) {
    const t = tokohById(a.siapa);
    return `<div class="ucap"><img src="${data.ava[t.id]}" alt=""><div>
      <span class="siapa">${esc(t.nama)}${a.emosi ? ` <span class="emosi">· ${esc(a.emosi)}</span>` : ''}</span>
      <p class="dialog">"${esc(a.dialog)}"</p></div></div>`;
  }

  function adeganBaca(a, i) {
    return `<li><span class="no">${i + 1}</span><div class="isi">
      ${a.suasana ? `<p class="suasana">${esc(a.suasana)}</p>` : ''}
      ${a.layar ? `<p class="layar">Di layar: ${sorotHarga(a.layar)}</p>` : ''}
      ${a.dialog ? ucapBaca(a) : ''}
    </div></li>`;
  }

  function adeganUbah(a, i) {
    const pilihan = data.tokoh.map((t) => `<option value="${t.id}"${t.id === a.siapa ? ' selected' : ''}>${esc(t.nama)}</option>`).join('');
    return `<li><span class="no">${i + 1}</span><div class="isi">
      <label class="f">Suasana / gerakan<textarea id="a${i}-suasana" data-i="${i}" data-k="suasana">${esc(a.suasana)}</textarea></label>
      <div class="baris">
        <label class="f">Siapa yang ngomong<select id="a${i}-siapa" data-i="${i}" data-k="siapa">${pilihan}</select></label>
        <label class="f">Emosi (buat ElevenLabs)<input id="a${i}-emosi" data-i="${i}" data-k="emosi" value="${esc(a.emosi)}"></label>
      </div>
      <label class="f">Dialog<textarea class="besar" id="a${i}-dialog" data-i="${i}" data-k="dialog">${esc(a.dialog)}</textarea></label>
      <label class="f">Teks di layar (boleh kosong)<input id="a${i}-layar" data-i="${i}" data-k="layar" value="${esc(a.layar)}"></label>
      <div class="aksi-adegan">
        <button type="button" data-aksi="tambah" data-i="${i}">+ Adegan setelah ini</button>
        <button type="button" data-aksi="naik" data-i="${i}"${i === 0 ? ' disabled' : ''}>Naik</button>
        <button type="button" data-aksi="turun" data-i="${i}"${i === data.adegan.length - 1 ? ' disabled' : ''}>Turun</button>
        <button type="button" class="hapus" data-aksi="hapus" data-i="${i}">Hapus</button>
      </div>
    </div></li>`;
  }

  function perTokoh() {
    const nomor = (i) => String(i + 1).padStart(2, '0');
    const grup = data.tokoh.map((t) => {
      const baris = data.adegan.map((a, i) => ({ a, i })).filter(({ a }) => a.siapa === t.id && a.dialog.trim());
      if (!baris.length) return '';
      return `<div class="grup">
        <div class="grup-kepala"><img src="${data.ava[t.id]}" alt=""><div><b>${esc(t.nama)}</b><span>Suara: ${esc(t.suara)} · ${baris.length} file</span></div></div>
        ${baris.map(({ a, i }) => `<div class="baris-suara">
          <span class="berkas">${nomor(i)}.mp3</span>
          <p>${esc(a.dialog)}${a.emosi ? `<small>Emosi: ${esc(a.emosi)}</small>` : ''}</p>
          <button type="button" data-salin="${i}">Salin</button>
        </div>`).join('')}
      </div>`;
    }).join('');
    return `<section class="kepala" aria-labelledby="h-tokoh">
      <h2 id="h-tokoh">Per tokoh buat ElevenLabs</h2>
      <p class="intro">Satu baris dialog jadi satu file. Pilih suara tokohnya, tempel dialognya, lalu simpan dengan nama file di sebelah kiri. Nomornya ikut urutan adegan.</p>
      <div class="pertokoh">${grup}</div>
    </section>`;
  }

  function render() {
    const ubah = mode === 'ubah';
    const nAdegan = data.adegan.length;
    root.innerHTML = `<div class="wrap">
      <header class="kepala">
        <p class="kecil">3 Putra · Iklan Meta · Draf naskah</p>
        ${ubah ? `<label class="f">Judul<input id="judul" data-k="judul" value="${esc(data.judul)}"></label>` : `<h1>${esc(data.judul)}</h1>`}
        <ul class="meta">${data.meta.map((m) => `<li>${esc(m)}</li>`).join('')}</ul>
        ${ubah ? `<label class="f">Ringkasan cerita<textarea id="intro" data-k="intro">${esc(data.intro)}</textarea></label>` : `<p class="intro">${esc(data.intro)}</p>`}
      </header>

      <section class="kepala" aria-labelledby="h-pemeran">
        <h2 id="h-pemeran">Pemeran</h2>
        <div class="pemeran">${data.tokoh.map((t, j) => `<div class="tokoh"><img src="${data.ava[t.id]}" alt="${esc(t.nama)}"><div>
          ${ubah ? `<label class="f">Nama<input id="t${j}-nama" data-t="${j}" data-k="nama" value="${esc(t.nama)}"></label>
                    <label class="f">Suara<input id="t${j}-suara" data-t="${j}" data-k="suara" value="${esc(t.suara)}"></label>`
                 : `<b>${esc(t.nama)}</b><span>${esc(t.suara)}</span>`}
        </div></div>`).join('')}</div>
      </section>

      <section class="kepala" aria-labelledby="h-adegan">
        <h2 id="h-adegan">Adegan</h2>
        <ol class="adegan">
          ${data.adegan.map(ubah ? adeganUbah : adeganBaca).join('')}
          <li><span class="no">${nAdegan + 1}</span><div class="isi">
            <p class="suasana">Penutup dengan logo 3 Putra. Teks saja, tanpa suara.</p>
            ${ubah ? `<label class="f">Tulisan penutup (satu baris satu kalimat)<textarea id="penutup" data-k="penutup" rows="4">${esc(data.penutup)}</textarea></label>`
                   : `<div class="penutup">${data.penutup.split('\n').filter(Boolean).map((p) => `<p>${esc(p)}</p>`).join('')}</div>`}
          </div></li>
        </ol>
        ${ubah ? `<div><button type="button" data-aksi="tambah" data-i="${nAdegan - 1}">+ Tambah adegan di akhir</button></div>` : ''}
      </section>

      ${ubah ? '' : perTokoh()}

      <section class="catatan" aria-labelledby="h-cek">
        <h2 id="h-cek">Yang perlu dicek</h2>
        <ul>
          <li>Ada dialog yang kurang pas, terlalu panjang, atau bukan gaya ngomong orang Demak?</li>
          <li>Nama tokoh sudah oke, atau mau diganti?</li>
          <li>Tulisan penutup dan nomor WhatsApp sudah benar?</li>
        </ul>
        <p>Klaim di naskah ini cuma pakai fakta yang sudah dikonfirmasi pemilik: harga per m² di website, harga pasti setelah survei, survei gratis, boleh batal tanpa biaya. Harga final di adegan 7 sengaja tidak ditunjukkan.</p>
        <p>Naskah sudah final. Dialog per tokoh ada di bagian Per tokoh buat ElevenLabs.</p>
      </section>
    </div>
    <div class="bar"><div class="bar-isi">
      <span class="status" role="status">${esc(pesan || (ubah ? 'Lagi mengubah naskah. Tekan Simpan kalau sudah.' : (bisaSimpan ? 'Mau ganti dialog? Tekan Ubah naskah.' : 'Halaman ini cuma bisa dibaca.')))}</span>
      ${ubah ? `<button type="button" data-aksi="batal">Batal</button><button type="button" class="utama" data-aksi="simpan">Simpan</button>`
             : (bisaSimpan ? `<button type="button" class="utama" data-aksi="ubah">Ubah naskah</button>` : '')}
    </div></div>`;
    root.querySelectorAll('textarea').forEach(tinggikan);
  }

  const tinggikan = (el) => { el.style.height = 'auto'; el.style.height = el.scrollHeight + 2 + 'px'; };

  root.addEventListener('input', (e) => {
    const el = e.target, k = el.dataset.k;
    if (el.tagName === 'TEXTAREA') tinggikan(el);
    if (!k) return;
    if (el.dataset.i !== undefined) data.adegan[+el.dataset.i][k] = el.value;
    else if (el.dataset.t !== undefined) data.tokoh[+el.dataset.t][k] = el.value;
    else data[k] = el.value;
  });
  root.addEventListener('change', (e) => {
    if (e.target.dataset.k === 'siapa') data.adegan[+e.target.dataset.i].siapa = e.target.value;
  });

  root.addEventListener('click', async (e) => {
    const sb = e.target.closest('button[data-salin]');
    if (sb) {
      const teks = data.adegan[+sb.dataset.salin].dialog;
      try { await navigator.clipboard.writeText(teks); sb.textContent = 'Tersalin'; }
      catch (_) {
        const r = document.createRange(); r.selectNodeContents(sb.previousElementSibling.firstChild);
        const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); sb.textContent = 'Sudah dipilih, salin manual';
      }
      return;
    }
    const b = e.target.closest('button[data-aksi]');
    if (!b) return;
    const aksi = b.dataset.aksi, i = +b.dataset.i;
    if (aksi === 'ubah') { mode = 'ubah'; pesan = ''; render(); return; }
    if (aksi === 'batal') { data = JSON.parse(JSON.stringify(asli)); mode = 'baca'; pesan = ''; render(); return; }
    if (aksi === 'tambah') { data.adegan.splice(i + 1, 0, { suasana: '', siapa: 'pak', emosi: '', dialog: '', layar: '' }); render(); document.getElementById(`a${i + 1}-suasana`)?.focus(); return; }
    if (aksi === 'hapus') {
      if (b.dataset.yakin) { data.adegan.splice(i, 1); render(); }
      else { b.dataset.yakin = '1'; b.textContent = 'Yakin hapus?'; }
      return;
    }
    if (aksi === 'naik' || aksi === 'turun') {
      const j = aksi === 'naik' ? i - 1 : i + 1;
      [data.adegan[i], data.adegan[j]] = [data.adegan[j], data.adegan[i]];
      render(); return;
    }
    if (aksi === 'simpan') await simpan(b);
  });

  function dokumen() {
    const json = JSON.stringify(data).replace(/</g, '\\u003c');
    const gaya = document.getElementById('gaya').textContent;
    const app = document.getElementById('app').textContent;
    return KERANGKA + KEPALA + '<style id="gaya">' + gaya + '</style>\n<div id="root"></div>\n'
      + '<script type="application/json" id="data">' + json + '<\/script>\n'
      + '<script id="app">' + app + '<\/script>\n</body></html>';
  }

  async function simpan(tombol) {
    tombol.disabled = true;
    pesan = 'Menyimpan...';
    root.querySelector('.status').textContent = pesan;
    const artifact = window.claude ? await window.claude.use('artifact') : null;
    if (!artifact) { bisaSimpan = false; pesan = 'Tidak bisa menyimpan dari tampilan ini. Buka halamannya di claude.ai.'; render(); return; }
    try {
      await artifact.publish(dokumen());
      pesan = 'Tersimpan. Halaman dimuat ulang.';
      root.querySelector('.status').textContent = pesan;
    } catch (err) {
      const kode = err && err.code;
      if (kode === 'conflict') pesan = 'Ada versi lebih baru yang tersimpan duluan. Halaman dimuat ulang ke versi itu.';
      else if (['not_writer', 'not_granted', 'not_declared', 'consent_required', 'capability_disabled', 'capability_removed'].includes(kode)) { bisaSimpan = false; mode = 'baca'; data = JSON.parse(JSON.stringify(asli)); pesan = 'Akun ini cuma bisa baca, perubahan tidak tersimpan.'; }
      else if (kode === 'rate_limited') pesan = 'Terlalu sering menyimpan. Tunggu sebentar, lalu tekan Simpan lagi.';
      else pesan = 'Gagal menyimpan. Coba tekan Simpan lagi.';
      render();
    }
  }

  render();
})();
</script>
</body></html>
