const NAVY = '#0B2D5B', KREM = '#FAF8F5', ORANYE = '#FF8A3D', ORANYE_GELAP = '#B54A0B', GELAP = '#231F1C';
let TL = null; // diisi dari luar: timeline.json

// ---------- utilitas ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, x) => a + (b - a) * x;
const ease = (x) => { x = clamp(x); return x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; };
const keluar = (x) => 1 - Math.pow(1 - clamp(x), 3);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function acak(n) { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

// gerak mulut dari amplop suara klip
function mulut(no, t) {
  const a = TL.adegan.find((s) => s.klip === no);
  if (!a) return 0;
  const lt = t - a.klipMulai;
  if (lt < 0 || lt > a.klipDurasi) return 0;
  const env = TL.env[no];
  const v = env[Math.min(env.length - 1, Math.floor(lt * TL.fps))] || 0;
  return clamp((v - 0.12) / 0.6);
}
const tanganBicara = (m, lt) => [226 + Math.sin(lt * 3.5) * 10, 332 - 75 * m];
const kedip = (t, seed) => ((t + seed * 1.7) % 3.4) < 0.12;

// ---------- karakter (gaya A) ----------
const G = { garis: GELAP, sw: 7, headR: 62, headCy: 96, sy: 178, hy: 345, gy: 500, bw: 118, armW: 30, legW: 34, kulit: '#E7C9A9' };

const gs = (w) => `stroke="${G.garis}" stroke-width="${w ?? G.sw}" stroke-linejoin="round" stroke-linecap="round"`;
const gm = () => `stroke="${GELAP}" stroke-width="5" stroke-linecap="round" fill="none"`;

// lengan dua ruas (lengan atas + lengan bawah) dengan siku; posisi siku dihitung dari jarak bahu ke tangan
const RUAS = 75;
function siku(x1, y1, x2, y2, sisi) {
  const dx = x2 - x1, dy = y2 - y1, d = Math.min(Math.hypot(dx, dy), RUAS * 2 - .01);
  const h = Math.sqrt(Math.max(0, RUAS * RUAS - (d / 2) ** 2));
  const ux = dx / (Math.hypot(dx, dy) || 1), uy = dy / (Math.hypot(dx, dy) || 1);
  const mx = x1 + ux * d / 2, my = y1 + uy * d / 2;
  const a = [mx - uy * h, my + ux * h], b = [mx + uy * h, my - ux * h];
  // pilih siku yang mengarah ke luar badan
  return (sisi < 0 ? a[0] < b[0] : a[0] > b[0]) ? a : b;
}
function lengan(x1, y1, x2, y2, baju, sisi) {
  const [ex, ey] = siku(x1, y1, x2, y2, sisi);
  const lx = x1 + (ex - x1) * .62, ly = y1 + (ey - y1) * .62;
  const tebal = G.armW, garis = G.armW + G.sw * 2;
  const ruas = (ax, ay, bx, by, w, c) => `<line x1="${ax}" y1="${ay}" x2="${bx}" y2="${by}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`;
  return ruas(x1, y1, ex, ey, garis, G.garis) + ruas(ex, ey, x2, y2, garis, G.garis)
    + ruas(ex, ey, x2, y2, tebal, G.kulit) + ruas(x1, y1, ex, ey, tebal, G.kulit)
    + ruas(x1, y1, lx, ly, tebal + 2, baju);
}

function badan(baju) {
  const { bw, sy, hy } = G, x0 = 130 - bw / 2, x1 = 130 + bw / 2, r = 28;
  return `<path d="M${x0},${sy + r} Q${x0},${sy} ${x0 + r},${sy} L${x1 - r},${sy} Q${x1},${sy} ${x1},${sy + r} L${130 + bw * .45},${hy} L${130 - bw * .45},${hy} Z" fill="${baju}" ${gs()}/>`;
}

function kaki(celana, langkah = 0) {
  const { bw, hy, gy, legW } = G;
  let s = '';
  [-1, 1].forEach((k, i) => {
    const dx = k * bw * .2, ang = (i ? -1 : 1) * langkah * 14;
    s += `<g transform="rotate(${ang} ${130 + dx} ${hy})">
      <rect x="${130 + dx - legW / 2}" y="${hy - 8}" width="${legW}" height="${gy - hy - 4}" rx="${legW / 2.6}" fill="${celana}" ${gs()}/>
      <rect x="${130 + dx - legW / 2 - 6 + k * 6}" y="${gy - 18}" width="${legW + 12}" height="18" rx="9" fill="#3A302A" ${gs()}/></g>`;
  });
  return s;
}

function rok(warna) {
  const { bw, hy, gy } = G;
  let s = '';
  [-1, 1].forEach((k) => { s += `<rect x="${130 + k * bw * .17 - 20}" y="${gy - 18}" width="40" height="18" rx="9" fill="#3A302A" ${gs()}/>`; });
  return s + `<path d="M${130 - bw * .45},${hy - 20} L${130 + bw * .45},${hy - 20} L${130 + bw * .62},${gy - 12} Q130,${gy - 4} ${130 - bw * .62},${gy - 12} Z" fill="${warna}" ${gs()}/>`;
}

function muka(o) {
  const r = G.headR, cy = G.headCy + (o.turun || 0), ey = cy + r * .05;
  const lx = (o.lirik || 0) * r * .08, ly = (o.lirikY || 0) * r * .06;
  let s = '';
  [-1, 1].forEach((sx) => {
    const ex = 130 + sx * r * .32;
    if (o.kedip) s += `<path d="M${ex - r * .1},${ey} L${ex + r * .1},${ey}" ${gm()}/>`;
    else s += `<ellipse cx="${ex + lx}" cy="${ey + ly}" rx="${r * .09}" ry="${r * .13}" fill="${GELAP}"/>`;
    const by = ey - r * .3, dX = 130 + sx * r * .18, lX = 130 + sx * r * .46;
    const alis = o.alis || 'datar';
    if (alis === 'cemas') s += `<path d="M${dX},${by - r * .08} L${lX},${by + r * .02}" ${gm()}/>`;
    if (alis === 'datar') s += `<path d="M${dX},${by} L${lX},${by}" ${gm()}/>`;
    if (alis === 'senang') s += `<path d="M${dX},${by} Q${(dX + lX) / 2},${by - r * .1} ${lX},${by}" ${gm()}/>`;
    if (alis === 'kesal') s += `<path d="M${dX},${by + r * .05} L${lX},${by - r * .04}" ${gm()}/>`;
    if (alis === 'curiga') s += sx < 0 ? `<path d="M${dX},${by + r * .02} L${lX},${by + r * .02}" ${gm()}/>` : `<path d="M${dX},${by - r * .02} Q${(dX + lX) / 2},${by - r * .16} ${lX},${by - r * .06}" ${gm()}/>`;
  });
  s += `<path d="M${130 + r * .02},${cy + r * .1} Q${130 + r * .13},${cy + r * .17} ${130 + r * .02},${cy + r * .22}" ${gm()}/>`;
  const my = cy + r * (o.kumis ? .5 : .44);
  const buka = o.mulut || 0;
  if (buka > .05) {
    s += `<ellipse cx="130" cy="${my + r * .04}" rx="${r * (.13 + .05 * buka)}" ry="${r * (.03 + .13 * buka)}" fill="#5A231C" ${gs(4)}/>`;
  } else {
    const e = o.ekspresi || 'datar';
    if (e === 'senyum') s += `<path d="M${130 - r * .18},${my - r * .04} Q130,${my + r * .12} ${130 + r * .18},${my - r * .04}" ${gm()}/>`;
    if (e === 'lebar') s += `<path d="M${130 - r * .22},${my - r * .05} Q130,${my + r * .2} ${130 + r * .22},${my - r * .05} Z" fill="#5A231C" ${gs(4)}/>`;
    if (e === 'cemas') s += `<path d="M${130 - r * .15},${my + r * .04} Q130,${my - r * .06} ${130 + r * .15},${my + r * .04}" ${gm()}/>`;
    if (e === 'datar') s += `<path d="M${130 - r * .12},${my} L${130 + r * .12},${my}" ${gm()}/>`;
    if (e === 'miring') s += `<path d="M${130 - r * .12},${my + r * .02} L${130 + r * .14},${my - r * .04}" ${gm()}/>`;
  }
  if (o.kumis) s += `<path d="M${130 - r * .24},${my - r * .1} Q130,${my - r * .24} ${130 + r * .24},${my - r * .1} Q130,${my - r * .04} ${130 - r * .24},${my - r * .1} Z" fill="${GELAP}"/>`;
  return s;
}

function kepalaPolos() { return `<circle cx="130" cy="${G.headCy}" r="${G.headR}" fill="${G.kulit}" ${gs()}/>`; }
function peci(warna = '#24211F') {
  const r = G.headR, cy = G.headCy, b = cy - r * .5, a = cy - r - 16;
  return `<path d="M${130 - r * .84},${b} L${130 - r * .74},${a} Q130,${a - 6} ${130 + r * .74},${a} L${130 + r * .84},${b} Z" fill="${warna}" ${gs()}/>`;
}
function rambut() {
  const r = G.headR, cy = G.headCy, R = r + 3, y0 = cy - r * .08;
  return `<path d="M${130 - R},${y0} A${R},${R} 0 0 1 ${130 + R},${y0} L${130 + r * .9},${cy - r * .28} L${130 + r * .35},${cy - r * .46} L${130 - r * .05},${cy - r * .32} L${130 - r * .45},${cy - r * .48} L${130 - r * .95},${cy - r * .22} Z" fill="#2A2420" ${gs()}/>`;
}
function topi() {
  const r = G.headR, cy = G.headCy, R = r + 4, y0 = cy - r * .32, dx = Math.sqrt(R * R - (cy - y0) ** 2);
  return `<path d="M${130 - dx},${y0} A${R},${R} 0 0 1 ${130 + dx},${y0} Z" fill="${NAVY}" ${gs()}/><ellipse cx="130" cy="${y0 + 2}" rx="${r * .9}" ry="${r * .17}" fill="#082142" ${gs()}/>`;
}
function hijab(warna) {
  const r = G.headR, cy = G.headCy, R = r + 12, bw = G.bw, sy = G.sy;
  return `<path d="M${130 - R},${cy} A${R},${R} 0 0 1 ${130 + R},${cy} C${130 + R},${cy + r * .9} ${130 + bw * .66},${sy + 20} ${130 + bw * .6},${sy + 78} Q130,${sy + 96} ${130 - bw * .6},${sy + 78} C${130 - bw * .66},${sy + 20} ${130 - R},${cy + r * .9} ${130 - R},${cy} Z" fill="${warna}" ${gs()}/>
    <ellipse cx="130" cy="${cy + r * .08}" rx="${r * .76}" ry="${r * .84}" fill="${G.kulit}" ${gs(5)}/>`;
}
function logoKaos() {

function prop(jenis, x, y) {

  if (jenis === 'teh') return `<path d="M${x - 22},${y - 20} h44 l-5,40 q-17,8 -34,0 Z" fill="#FFFFFF" ${gs(5)}/><path d="M${x + 20},${y - 10} q16,0 14,14 q-2,10 -16,8" fill="none" ${gs(5)}/><path d="M${x - 8},${y - 34} q6,-8 0,-16 M${x + 6},${y - 36} q6,-8 0,-16" stroke="#D8D8D8" stroke-width="4" fill="none" stroke-linecap="round" opacity=".8"/>`;
  return '';
}

// o: mulut, kedip, alis, ekspresi, lirik, tL/tR [x,y] posisi tangan, pL/pR prop, angguk, miring, langkah
function tokoh(id, o = {}) {
  const [baju, bawah] = WARNA[id];
  const { bw, sy, hy } = G, xL = 130 - bw / 2 + 12, xR = 130 + bw / 2 - 12;
  const tL = o.tL || [xL - 16, hy - 6], tR = o.tR || [xR + 16, hy - 6];
  let s = '';
  s += id === 'bu' ? rok(bawah) : kaki(bawah, o.langkah || 0);
  s += lengan(xL, sy + 18, tL[0], tL[1], baju, -1);
  s += `<rect x="117" y="${G.headCy + G.headR - 14}" width="26" height="${sy - G.headCy - G.headR + 24}" fill="${G.kulit}" ${gs()}/>`;
  s += badan(baju);
  if (id === 'tukang') s += logoKaos();
  // kepala
  let k = '';
  if (id === 'bu') k += hijab(baju) + muka({ ...o, turun: 4 });
  else {
    k += kepalaPolos() + muka({ ...o, kumis: id === 'pak' || id === 'tetangga' });
    if (id === 'pak') k += peci();
    if (id === 'tetangga') k += peci('#5A4632');
    if (id === 'anak') k += rambut();
    if (id === 'tukang') k += topi();
  }
  s += `<g transform="translate(0 ${o.angguk || 0}) rotate(${o.miring || 0} 130 ${G.headCy + G.headR})">${k}</g>`;
  s += lengan(xR, sy + 18, tR[0], tR[1], baju, 1);
  if (o.pL) s += prop(o.pL, tL[0], tL[1]);
  if (o.pR) s += prop(o.pR, tR[0], tR[1]);
  s += `<circle cx="${tL[0]}" cy="${tL[1]}" r="${G.armW * .58}" fill="${G.kulit}" ${gs()}/>`;
  s += `<circle cx="${tR[0]}" cy="${tR[1]}" r="${G.armW * .58}" fill="${G.kulit}" ${gs()}/>`;
  return s;
}

function hujan(x0, y0, w, h, t, n, seed = 1, warna = '#C9D6E6', alpha = .45) {
  let s = `<g opacity="${alpha}">`;
  for (let i = 0; i < n; i++) {
    const rx = acak(i + seed * 100), ry = acak(i * 3.1 + seed);
    const sp = 1300 + acak(i * 7.3) * 600;
    const x = x0 + rx * w, y = y0 + ((ry * h + t * sp) % (h + 60)) - 60;
    s += `<line x1="${x}" y1="${y}" x2="${x - 9}" y2="${y + 42}" stroke="${warna}" stroke-width="3" stroke-linecap="round"/>`;
  }
  return s + '</g>';
}

// kanopi: p 0..1 progres pasang (tiang, rangka, atap)
function kanopi(p, malam) {
  const tiang = ease(p / .4), rangka = ease((p - .4) / .2), atap = ease((p - .6) / .4);
  const xs = [90, 990], atas = 640, bawah = 1380;
  let s = '';
  xs.forEach((x) => { const y = lerp(bawah, atas, tiang); s += `<rect x="${x - 16}" y="${y}" width="32" height="${bawah - y}" fill="#8E969E" stroke="${GELAP}" stroke-width="8"/>`; });
  if (rangka > 0) s += `<rect x="60" y="${atas - 22}" width="${lerp(0, 960, rangka)}" height="30" fill="#8E969E" stroke="${GELAP}" stroke-width="8"/>`;
  if (atap > 0) {
    const kanan = lerp(40, 1040, atap);
    s += `<path d="M40,${atas - 20} L${kanan},${atas - 20} L${kanan},${atas - 90} L40,${atas - 170} Z" fill="${malam ? '#566170' : '#7D8A99'}" stroke="${GELAP}" stroke-width="10" stroke-linejoin="round"/>`;
    for (let i = 1; i < 12; i++) { const x = 40 + i * 85; if (x < kanan) s += `<path d="M${x},${atas - 20} L${x},${atas - 170 + (x - 40) * 80 / 1000}" stroke="${malam ? '#46505E' : '#6A7685'}" stroke-width="6"/>`; }
  }
  return s;
}

}

    <rect x="-180" y="-10" width="360" height="330" rx="18" fill="#FFFFFF" stroke="#E6E0D6" stroke-width="2"/>
    <text x="-155" y="30" font-size="20" font-weight="600" fill="#5E6470">Perkiraan biaya</text>
    <text x="-155" y="100" font-size="${lerp(36, 44, keluar(harga))}" fill="${ORANYE_GELAP}" opacity="${harga}" style="font-family:Fraunces,serif;font-weight:600">${angka}</text>
    <text x="-155" y="140" font-size="19" fill="#5E6470" opacity="${harga}">Rp 450.000 / m² × 20 m²</text>
    <g opacity="${o.sorot ? 1 : harga}">
      ${o.sorot ? `<rect x="-162" y="${168}" width="${lerp(0, 330, o.sorot)}" height="120" rx="8" fill="#DCE6F3"/>` : ''}
      <text font-size="18" fill="#3E4450"><tspan x="-155" y="190">Harga borongan, sudah termasuk bahan</tspan><tspan x="-155" y="214">dan pasang. Ini masih perkiraan,</tspan><tspan x="-155" y="246" font-weight="${o.sorot ? 800 : 400}" fill="${o.sorot ? NAVY : '#3E4450'}">harga pastinya kami kasih</tspan><tspan x="-155" y="272" font-weight="${o.sorot ? 800 : 400}" fill="${o.sorot ? NAVY : '#3E4450'}">setelah survei.</tspan></text>
    </g>
    <rect x="-170" y="340" width="340" height="56" rx="14" fill="${ORANYE}"/><text x="0" y="376" font-size="22" font-weight="800" fill="${NAVY}" text-anchor="middle">Lanjut chat WhatsApp</text>
  </g>`;
}

function kartuInfo(masuk) {
  const x = lerp(-420, 48, keluar(masuk));
  return `<g transform="translate(${x} 210)">
    <rect width="380" height="176" rx="18" fill="${NAVY}"/>
    <text x="28" y="46" font-size="24" font-weight="600" fill="${KREM}" opacity=".8">Teras ${esc(TL.tokoh.pak)}</text>
    <text x="28" y="100" font-size="46" fill="${KREM}" style="font-family:Fraunces,serif;font-weight:600">5 m × 4 m</text>
    <text x="28" y="152" font-size="42" fill="${ORANYE}" style="font-family:Fraunces,serif;font-weight:600">Rp9.000.000</text></g>`;
}

function gelembungPikir(x, y, sk, t, isi) {
  return `<g transform="translate(${x} ${y}) scale(${sk})">
    <circle cx="-210" cy="250" r="14" fill="${KREM}" ${gs(5)}/><circle cx="-170" cy="200" r="22" fill="${KREM}" ${gs(5)}/>
    <ellipse cx="0" cy="0" rx="230" ry="190" fill="${KREM}" ${gs(7)}/>${isi}</g>`;
}

// ---------- teks per kata ----------
const ukur = document.createElement('canvas').getContext('2d');
function lebarTeks(s, px) { ukur.font = `800 ${px}px Figtree`; return ukur.measureText(s).width; }
function potongKata(no) {
  const kata = TL.kata[no], hasil = [];
  let skr = [];
  kata.forEach((k) => {
    const calon = [...skr, k];
    const teks = calon.map((x) => x.w).join(' ');
    if (skr.length && (calon.length > 3 || teks.length > 20)) { hasil.push(skr); skr = [k]; }
    else skr = calon;
    if (/[.,!?]$/.test(k.w) && skr.length) { hasil.push(skr); skr = []; }
  });
  if (skr.length) hasil.push(skr);
  return hasil;
}
const POTONGAN = {};
function teksBicara(t) {
  const a = TL.adegan.find((s) => s.klip && t >= s.klipMulai - .05 && t <= s.klipMulai + s.klipDurasi + .25);
  if (!a) return '';
  const lt = t - a.klipMulai;
  POTONGAN[a.klip] = POTONGAN[a.klip] || potongKata(a.klip);
  const grup = POTONGAN[a.klip];
  let g = grup[0];
  for (const x of grup) if (lt >= x[0].s - .05) g = x;
  const px = 66, spasi = 18, y = 1440;
  const lebar = g.map((k) => lebarTeks(k.w, px));
  const total = lebar.reduce((p, c) => p + c, 0) + spasi * (g.length - 1);
  let x = (W - total) / 2, s = '';
  const aktif = g.reduce((idx, k, i) => (lt >= k.s - .03 ? i : idx), 0);
  g.forEach((k, i) => {
    if (i === aktif) {
      s += `<rect x="${x - 12}" y="${y - 62}" width="${lebar[i] + 24}" height="84" rx="16" fill="${KREM}"/>`;
      s += `<text x="${x}" y="${y}" font-size="${px}" font-weight="800" fill="${NAVY}">${esc(k.w)}</text>`;
    } else {
      s += `<text x="${x}" y="${y}" font-size="${px}" font-weight="800" fill="#FFFFFF" stroke="${GELAP}" stroke-width="12" stroke-linejoin="round" paint-order="stroke">${esc(k.w)}</text>`;
    }
    x += lebar[i] + spasi;
  });
  return s;
}

// ---------- adegan ----------
const posisiKata = (no, kata) => { const k = TL.kata[no].find((x) => x.w.toLowerCase().startsWith(kata)); const a = TL.adegan.find((s) => s.klip === no); return a.klipMulai + (k ? k.s : 0); };

const ADEGAN = {
  s1(lt, t, a) {
    // Pak dorong motor masuk, Bu pegang pel dan ngomel
    const maju = ease(lt / .9);
    const mx = lerp(150, 470, maju);
    let s = latarDalamMalam(t);
    // genangan & tetesan
    const gen = clamp((lt - 1) / 4);
    s += `<ellipse cx="${mx + 20}" cy="1395" rx="${60 + 120 * gen}" ry="${10 + 12 * gen}" fill="#5D7290" opacity=".55"/>`;
    for (let i = 0; i < 4; i++) { const f = (t * 1.6 + i / 4) % 1; s += `<ellipse cx="${mx - 60 + i * 40}" cy="${1250 + f * 140}" rx="6" ry="10" fill="#8FB0D8" opacity="${1 - f}"/>`; }
    s += motor(mx, 1400, 1.25);
    const lang = maju < 1 ? Math.sin(lt * 12) : 0;
    let tanganPak = { tL: [60, 250], tR: [200, 250] }, miringPak = 0, lirikPak = .6;
    if (lt > 1.0 && lt < 2.6) { const g = Math.sin((lt - 1) * 9); tanganPak = { tL: [70, 330], tR: [170 + g * 22, 70 + Math.abs(g) * 10] }; lirikPak = -.3; }
    if (lt >= 2.6) { tanganPak = { tL: [52, 300], tR: [208, 300] }; miringPak = Math.sin(lt * 3) * 4; lirikPak = .9; }
    const pakX = maju < 1 ? mx - 300 : lerp(mx - 300, mx - 150, ease((lt - 1) / .5));
    s += taruh(tokoh('pak', { ...tanganPak, alis: 'cemas', ekspresi: 'cemas', langkah: lang || (lt > 1 && lt < 1.5 ? Math.sin(lt * 12) : 0), kedip: kedip(t, 1), lirik: lirikPak, miring: miringPak }), pakX, 1400, 1.45);
    if (lt > 1.0 && lt < 2.6) for (let i = 0; i < 3; i++) { const f = ((lt - 1) * 2 + i / 3) % 1; s += `<ellipse cx="${pakX + 60 + i * 26}" cy="${1400 - 1.45 * 470 + f * 90}" rx="5" ry="8" fill="#8FB0D8" opacity="${1 - f}"/>`; }
    const m = mulut('01', t);
    s += taruh(tokoh('bu', { mulut: m, alis: 'kesal', ekspresi: 'datar', tL: [52, 300], tR: [208, 300], kedip: kedip(t, 2), lirik: -1, miring: m > .1 ? Math.sin(t * 6) * 2 : 0 }), 850, 1400, 1.5);
    return s;
  },
  s2(lt, t) {
    let s = latarDalamMalam(t);
    const m = mulut('02', t);
    const garuk = Math.sin(lt * 10) * 12;
    s += taruh(tokoh('pak', { mulut: m, alis: 'cemas', ekspresi: 'cemas', tR: [205 + garuk * .3, 40 + garuk], tL: [100, 330], kedip: kedip(t, 1), lirik: -.4, lirikY: -.5, miring: -4 }), 380, 1720, 2.3);
    const muncul = keluar((lt - .8) / .5);
    if (muncul > 0) {
      const geleng = Math.sin(lt * 7) * 6;
      const isi = `<g transform="translate(-70 150) scale(.62)">${taruh(tokoh('tetangga', { alis: 'cemas', ekspresi: 'cemas', miring: geleng, lirik: .8, lirikY: .6 }), 0, 0, 1)}</g>
        <g transform="translate(90 -40)"><rect x="-70" y="-90" width="140" height="180" rx="8" fill="#FFFFFF" ${gs(5)}/>
        <text x="0" y="-48" font-size="26" font-weight="800" fill="${GELAP}" text-anchor="middle">NOTA</text>
        ${[0, 1, 2, 3].map((i) => `<path d="M-48,${-20 + i * 26} h${50 + i * 10}" stroke="#9AA3AE" stroke-width="6" stroke-linecap="round"/><text x="${42}" y="${-12 + i * 26}" font-size="${22 + i * 4}" font-weight="800" fill="#A3322A" opacity="${clamp((lt - 1.5 - i * .9) / .3)}">+</text>`).join('')}</g>`;
      s += `<g opacity="${muncul}">${gelembungPikir(760, 520, .95 * muncul + .05, t, isi)}</g>`;
    }
    return s;
  },
  s3(lt, t) {
    let s = latarDalamMalam(t);
    const masuk = ease(lt / .9);
    const ax = lerp(1250, 790, masuk);
    s += taruh(tokoh('pak', { alis: 'datar', ekspresi: 'datar', kedip: kedip(t, 1), lirik: .8 }), 250, 1720, 1.9);
    const m = mulut('03', t);
    s += taruh(tokoh('anak', { mulut: m, alis: 'senang', ekspresi: 'senyum', tR: tanganBicara(m, lt), kedip: kedip(t, 3), lirik: -.8, langkah: masuk < 1 ? Math.sin(lt * 10) : 0 }), ax, 1720, 1.9);
    const tP = posisiKata('03', 'lima'), tL_ = posisiKata('03', 'empat'), tH = posisiKata('03', 'sembilan');
    const hpMuncul = keluar((lt - 1.2) / .45);
    if (hpMuncul > 0) s += `<rect width="${W}" height="${H}" fill="#0E131A" opacity="${.45 * hpMuncul}"/>` + hp(540, 830, 1.38 * hpMuncul, { isiP: t > tP ? 1 : 0, isiL: t > tL_ ? 1 : 0, harga: clamp((t - tH) / .35) });
    return s;
  },
  s4(lt, t) {
    let s = latarDalamMalam(t);
    const m = mulut('04', t);
    s += taruh(tokoh('pak', { mulut: m, alis: 'curiga', ekspresi: 'miring', lirik: 1, kedip: false, miring: 6, tL: [70, 330], tR: [190, 330] }), 470, 2050, 3.0);
    s += kartuInfo(clamp(lt / .5));
    return s;
  },
  s5(lt, t) {
    let s = latarDalamMalam(t);
    s += taruh(tokoh('anak', { mulut: mulut('05', t), alis: 'senang', ekspresi: 'senyum', tR: tanganBicara(mulut('05', t), lt), kedip: kedip(t, 3), lirik: -.5 }), 880, 1850, 1.7);
    const tS = posisiKata('05', 'harga');
    const zoom = lerp(1.0, 1.55, ease(lt / .8));
    s += hp(480, lerp(900, 640, ease(lt / .8)), zoom, { isiP: 1, isiL: 1, harga: 1, sorot: clamp((t - tS) / .9) });
    return s;
  },
  s6(lt, t, a) {
    let s = latarDalamMalam(t);
    const m = mulut('06', t);
    const akhir = a.durasi - .7;
    const angguk = lt > akhir ? Math.sin((lt - akhir) * 14) * 10 * (1 - (lt - akhir) / .7) : 0;
    const mikir = lt < 1.0;
    s += taruh(tokoh('pak', { mulut: m, alis: mikir ? 'cemas' : 'datar', ekspresi: lt > akhir ? 'senyum' : 'datar', tR: [175, 220], tL: [100, 330], lirikY: mikir ? -.8 : 0, lirik: mikir ? .5 : 0, kedip: kedip(t, 1), angguk }), 540, 1760, 2.4);
    s += kartuInfo(1);
    return s;
  },
  t1(lt) {
    const tutup = lt < .5 ? ease(lt / .3) : 1;
    return `<rect width="${W}" height="${H}" fill="${NAVY}" opacity="${tutup}"/>
      <text x="${W / 2}" y="${H / 2}" font-size="96" fill="${KREM}" text-anchor="middle" opacity="${clamp((lt - .15) / .25) * (1 - clamp((lt - .8) / .2))}" style="font-family:Fraunces,serif;font-weight:600">Hari survei</text>`;
  },
  s7(lt, t, a) {
    let s = latarLuarSiang(t);
    const m = mulut('07', t);
    s += taruh(tokoh('tukang', { mulut: m, alis: 'senang', ekspresi: 'senyum', tR: tanganBicara(m, lt), kedip: kedip(t, 4), lirik: .8 }), 330, 1760, 1.8);
    const simak = lt > 1.8 && lt < 2.6 ? Math.sin((lt - 1.8) * 12) * 5 : 0;
    s += taruh(tokoh('pak', { alis: 'datar', ekspresi: 'datar', kedip: kedip(t, 1), lirik: -.8, angguk: simak }), 760, 1760, 1.8);
    return s;
  },
  s8(lt, t, a) {
    let s = latarLuarSiang(t);
    const m = mulut('08', t);
    const akhirnya = lt > a.durasi - .8;
    const angguk = (x) => Math.sin(x * 12) * 6;
    s += taruh(tokoh('tukang', { alis: 'senang', ekspresi: akhirnya ? 'lebar' : 'senyum', kedip: kedip(t, 4), lirik: .8, angguk: akhirnya ? angguk(lt) : 0 }), 330, 1760, 1.8);
    s += taruh(tokoh('pak', { mulut: m, alis: 'senang', ekspresi: 'lebar', kedip: kedip(t, 1), lirik: -.8, angguk: m > .15 ? angguk(lt) : 0 }), 760, 1760, 1.8);
    return s;
  },
  t2(lt, t, a) {
    let s = latarLuarSiang(t);
    s += kanopi(clamp(lt / (a.durasi - .3)), false);
    s += taruh(tokoh('tukang', { alis: 'senang', ekspresi: 'senyum', tR: [230, 200], kedip: kedip(t, 4) }), 540, 1760, 1.5);
    return s;
  },
  s9(lt, t) {
    let s = latarLuarMalamKanopi(t);
    s += motor(330, 1430, 1.15);
    const m = mulut('09', t);
    const lihatAtas = lt < 1.3;
    s += taruh(tokoh('pak', { alis: 'senang', ekspresi: 'senyum', kedip: kedip(t, 1), lirik: lihatAtas ? 0 : .8, lirikY: lihatAtas ? -1 : 0, miring: lihatAtas ? -3 : 0 }), 620, 1780, 1.55);
    s += taruh(tokoh('bu', { mulut: m, alis: 'senang', ekspresi: 'senyum', kedip: kedip(t, 2), lirik: lihatAtas ? 0 : -.8, lirikY: lihatAtas ? -1 : 0, miring: m > .1 ? Math.sin(t * 5) * 2 : 0 }), 880, 1780, 1.55);
    return s;
  },
  akhir(lt) {
    const baris = TL.penutup.split('\n').filter(Boolean);
    const muncul = (i) => clamp((lt - 2.2 - i * .3) / .4);
    let s = `<rect width="${W}" height="${H}" fill="${NAVY}"/>`;
    // tanda logo: garis tergambar seperti sketsa rangka lalu warnanya diisi (sama dengan .logo-loading di globals.css)
    const tunda = [0, .1, .3];
    const sk = 880 / 778, ox = (W - 778 * sk) / 2;
    s += `<g transform="translate(${ox} 330) scale(${sk}) translate(-237 -113)">`;
    LOGO.forEach((p, i) => {
      if (i < 3) {
        const x = clamp((lt - tunda[i]) / 1.28);          // 0..40% dari 3,2 dtk
        const isi = clamp((lt - tunda[i] - 1.22) / .54);  // 38%..55%
        s += `<path d="${p.d}" fill="${p.fill}" fill-rule="${p.rule}" fill-opacity="${isi}" stroke="${p.fill}" stroke-width="${i === 2 ? 0 : 3}" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="${1 - ease(x)}"/>`;
      } else {
        const muncul = clamp((lt - 1.6 - (i - 3) * .15) / .45);
        s += `<path d="${p.d}" fill="${p.fill}" fill-rule="${p.rule}" opacity="${muncul}" transform="translate(0 ${(1 - keluar(muncul)) * 14})"/>`;
      }
    });
    s += `</g>`;
    // baris penutup, dibungkus manual
    let y = 1060;
    baris.forEach((b, i) => {
      const kata = b.split(' '), lines = []; let skr = '';
      kata.forEach((k) => { const c = (skr + ' ' + k).trim(); if (lebarTeks(c, 44) > 900 && skr) { lines.push(skr); skr = k; } else skr = c; });
      lines.push(skr);
      lines.forEach((l) => { s += `<text x="${W / 2}" y="${y}" font-size="44" font-weight="600" fill="${KREM}" text-anchor="middle" opacity="${muncul(i)}">${esc(l)}</text>`; y += 60; });
      y += 30;
    });
    return s;
  },
};

function kamera(a, lt, isi) {
  if (a.id[0] !== 's') return isi;
  const z = 1 + .045 * ease(lt / a.durasi);
  return `<g transform="translate(540 1150) scale(${z}) translate(-540 -1150)">${isi}</g>`;
}
function gambar(t) {
  const idx = TL.adegan.findIndex((s) => t >= s.mulai && t < s.mulai + s.durasi);
  const i = idx < 0 ? TL.adegan.length - 1 : idx;
  const a = TL.adegan[i], lt = t - a.mulai;
  let s = kamera(a, lt, ADEGAN[a.id](lt, t, a));
  const SILANG = .4;
  if (i > 0 && lt < SILANG) {
    const b = TL.adegan[i - 1], tb = b.mulai + b.durasi - .001;
    s += `<g opacity="${1 - ease(lt / SILANG)}">${kamera(b, b.durasi - .001, ADEGAN[b.id](b.durasi - .001, tb, b))}</g>`;
  }
  s += teksBicara(t);
  document.getElementById('layar').innerHTML = s;
}
window.siapkan = (tl) => { TL = tl; return document.fonts.ready.then(() => document.fonts.load('800 66px Figtree')).then(() => document.fonts.load('600 40px Fraunces')).then(() => true); };
window.gambar = gambar;
</script>
